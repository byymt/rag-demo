<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kb_qa 提问</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; padding: 20px; }
  .wrap { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column;
          height: calc(100vh - 40px); }
  .nav { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .nav h1 { font-size: 18px; flex: 1; }
  .nav a { color: #4a7cff; text-decoration: none; font-size: 14px; }
  #chat { flex: 1; overflow-y: auto; background: #fff; border-radius: 12px;
          padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .bubble { max-width: 85%; padding: 10px 14px; border-radius: 10px;
            margin-bottom: 10px; font-size: 14px; white-space: pre-wrap; line-height: 1.6; }
  .user { background: #4a7cff; color: #fff; margin-left: auto; }
  .bot { background: #f1f3f7; color: #333; }
  .input-row { display: flex; gap: 10px; margin-top: 12px; }
  #q { flex: 1; padding: 10px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; }
  button { padding: 10px 20px; border: none; border-radius: 6px;
           background: #4a7cff; color: #fff; font-size: 14px; cursor: pointer; }
  .tip { color: #999; font-size: 12px; text-align: center; margin-top: 8px; }
  /* 右上角弹窗通知：多端互动——别人的上传/提问实时提醒我 */
  #toast-box { position: fixed; top: 16px; right: 16px; z-index: 999; display: flex;
               flex-direction: column; gap: 8px; max-width: 320px; }
  .toast { background: #32363f; color: #fff; padding: 10px 14px; border-radius: 8px;
           font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.25);
           animation: slidein .3s ease; line-height: 1.5; }
  .toast b { color: #7fb2ff; }
  @keyframes slidein { from { transform: translateX(120%); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div id="toast-box"></div>
  <div class="wrap">
    <div class="nav">
      <h1>💬 知识库提问</h1>
      <a href="docs.html">← 文档管理</a>
      <a href="#" onclick="clearMemory()" id="mem-link">🧠 清除记忆</a>
    </div>

    <div id="chat">
      <div class="bubble bot">你好！答案只基于已上传的文档。没有资料时我会明确告诉你。</div>
    </div>

    <div class="input-row">
      <input id="q" placeholder="输入问题，回车发送..." onkeydown="if(event.key==='Enter')send()">
      <button onclick="send()">发送</button>
    </div>
    <p class="tip">每个浏览器标签页是独立会话，支持多轮追问</p>
  </div>

<script>
if (!localStorage.getItem("kb_token")) location.href = "index.html";

// 清除长期记忆（长期记忆=智能体记住的你的偏好/学习进度，重启不丢；清除后从头记）
async function clearMemory() {
  if (!confirm("确定清除智能体记住的你的长期记忆（偏好/进度）吗？")) return;
  const r = await fetch("/kb/memory/clear", {
    method: "POST",
    headers: { "X-Token": localStorage.getItem("kb_token") },
  });
  const data = await r.json().catch(() => ({}));
  alert(r.ok ? (data.message || "已清除") : "清除失败，请重新登录后重试");
}

// 会话编号：一个标签页一份，实现多轮记忆
// 注意：crypto.randomUUID 只在 HTTPS/localhost 下可用，
// 服务器用 http://IP 访问时不存在，所以要带降级方案
function makeSessionId() {
  if (window.crypto && crypto.randomUUID) {
    return crypto.randomUUID().replaceAll("-", "");
  }
  return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

let sessionId = localStorage.getItem("kb_session");
if (!sessionId) {
  sessionId = makeSessionId();
  localStorage.setItem("kb_session", sessionId);
}

const chatEl = document.getElementById("chat");
const qEl = document.getElementById("q");

function addBubble(text, who) {
  const div = document.createElement("div");
  div.className = "bubble " + who;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function send() {
  const q = qEl.value.trim();
  if (!q) return;
  addBubble(q, "user");
  qEl.value = "";

  // 两个气泡：思考过程（灰色小字，实时滚动）+ 最终答案
  const think = document.createElement("div");
  think.className = "bubble bot";
  think.style.cssText = "background:#f8f9fb;color:#889;font-size:12px";
  think.textContent = "思考中...";
  chatEl.appendChild(think);
  const answer = document.createElement("div");
  answer.className = "bubble bot";
  answer.style.display = "none";
  chatEl.appendChild(answer);

  const r = await fetch("/chat/stream", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Token": localStorage.getItem("kb_token"),  // 鉴权头：漏了会被后端 401 踢回登录页
    },
    body: JSON.stringify({ question: q, session_id: sessionId }),
  });

  if (r.status === 401) {
    localStorage.removeItem("kb_token");
    localStorage.removeItem("kb_user");
    localStorage.removeItem("kb_admin");
    alert("登录已过期（服务器可能刚重启过），请重新登录");
    location.href = "index.html";
    return;
  }

  if (!r.ok || !r.body) {
    // 流式失败 → 退回普通接口
    const data = await (r.json ? r.json() : {});
    chatEl.removeChild(think);
    answer.style.display = "";
    answer.textContent = data.detail?.[0]?.msg || data.detail || "请求失败";
    chatEl.scrollTop = chatEl.scrollHeight;
    return;
  }

  // 逐段读取 SSE 流：data: {...}\n\n
  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buf = "", raw = "", inAnswer = false, sources = null;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split("\n");
    buf = lines.pop();  // 最后一段可能不完整，留到下一轮
    for (const line of lines) {
      if (!line.startsWith("data: ")) continue;
      const payload = line.slice(6);
      if (payload === "[DONE]") continue;
      const obj = JSON.parse(payload);
      if (obj.sources) { sources = obj.sources; continue; }  // 引用来源事件，流末尾才到
      raw += obj.text;
      const idx = raw.indexOf("最终答案");
      if (idx === -1) {
        think.textContent = raw.trim() || "思考中...";
      } else {
        // 看到"最终答案:" → 思考过程收起，答案气泡开始打字机
        if (!inAnswer) {
          inAnswer = true;
          think.textContent = raw.slice(0, idx).trim() || "（无思考过程）";
          answer.style.display = "";
        }
        answer.textContent = raw.slice(idx).replace(/^最终答案[:：]/, "").trim();
      }
      chatEl.scrollTop = chatEl.scrollHeight;
    }
  }
  if (!inAnswer) {  // 没等到"最终答案"标记（如报错文案），原样展示
    think.remove();
    answer.style.display = "";
    answer.textContent = raw.trim() || "请求失败";
  }
  if (sources && sources.length) {  // 引用溯源：回答下方列出命中的课件片段
    const cite = document.createElement("div");
    cite.style.cssText = "font-size:12px;color:#888;margin-top:6px;line-height:1.6;";
    cite.textContent = "引用来源：" + sources.map(
      (s, i) => `[${i + 1}] ${s.name}${s.page ? "(第" + s.page + "页)" : ""}`
    ).join("　");
    answer.after(cite);
  }
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ============ 多端互动：弹窗通知 ============
// 每 3 秒拉一次 /kb/activity，别人的上传/提问在右上角弹窗提醒
// （和 docs.html 同一套机制：A 操作 → B 立刻收到"消息"）
const esc = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const me = localStorage.getItem("kb_user");
let lastActTime = null;

function toast(html) {
  const box = document.getElementById("toast-box");
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = html;   // 内容已做 esc() 转义，安全
  box.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}

async function pollActivity() {
  const r = await fetch("/kb/activity", {
    headers: { "X-Token": localStorage.getItem("kb_token") },
  });
  if (r.status === 401) {
    localStorage.removeItem("kb_token");
    localStorage.removeItem("kb_user");
    localStorage.removeItem("kb_admin");
    alert("登录已过期（服务器可能刚重启过），请重新登录");
    location.href = "index.html";
    return;
  }
  const acts = (await r.json()).activities || [];
  if (lastActTime !== null) {
    for (const a of acts) {
      if (a.time > lastActTime && a.actor !== me) {
        const verb = a.type === "upload" ? "上传了新文档" : "刚问了问题";
        toast(`📡 <b>${esc(a.actor)}</b> ${verb}<br>${esc(a.detail)}`);
      }
    }
  }
  if (acts.length) lastActTime = acts[0].time;
}

pollActivity();
setInterval(pollActivity, 3000);
</script>
</body>
</html>
