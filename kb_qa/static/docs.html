<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kb_qa 文档管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; padding: 20px; }
  .wrap { max-width: 800px; margin: 0 auto; }
  .nav { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .nav h1 { font-size: 18px; flex: 1; }
  .nav a { color: #4a7cff; text-decoration: none; font-size: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px;
          box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .upload-row { display: flex; gap: 10px; }
  .upload-row input[type=file] { flex: 1; font-size: 13px; }
  button { padding: 8px 16px; border: none; border-radius: 6px;
           background: #4a7cff; color: #fff; font-size: 13px; cursor: pointer; }
  button:hover { background: #3565e0; }
  button.del { background: #e04848; padding: 4px 10px; }
  button.del:hover { background: #c23a3a; }
  button.rename { background: #ff9a3c; padding: 4px 10px; margin-right: 6px; }
  button.rename:hover { background: #e08a30; }
  button.small { padding: 3px 8px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }
  th { color: #666; }
  .msg { font-size: 13px; margin-top: 10px; }
  .ok { color: #2eaa5e; } .err { color: #e04848; }
  .empty { color: #999; text-align: center; padding: 16px; }
  .sync-tag { font-size: 12px; color: #2eaa5e; background: #e6f7ec; padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
  .row-edit input { width: 180px; padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
  /* 活动流 */
  .act-item { display: flex; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f2f2f2; font-size: 13px; }
  .act-item:last-child { border-bottom: none; }
  .act-icon { flex-shrink: 0; }
  .act-time { color: #999; font-size: 12px; margin-left: auto; flex-shrink: 0; }
  /* 右上角弹窗通知（多端互动"收到消息"的感知） */
  #toast-box { position: fixed; top: 16px; right: 16px; z-index: 999; display: flex;
               flex-direction: column; gap: 8px; max-width: 320px; }
  .toast { background: #32363f; color: #fff; padding: 10px 14px; border-radius: 8px;
           font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.25);
           animation: slidein .3s ease; line-height: 1.5; }
  .toast b { color: #7fb2ff; }
  @keyframes slidein { from { transform: translateX(120%); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div id="toast-box"></div>
  <div class="wrap">
    <div class="nav">
      <h1>📁 文档管理 <span class="sync-tag" id="sync-tag">🔄 实时同步中</span></h1>
      <span id="who" style="font-size:14px;color:#555"></span>
      <a href="admin.html" id="admin-link" hidden>🛡 管理端 →</a>
      <a href="chat.html">去提问 →</a>
      <a href="#" onclick="logout()">退出</a>
    </div>

    <div class="card">
      <div class="upload-row">
        <input type="file" id="file" accept=".pdf,.txt,.md,.docx,.pptx">
        <button onclick="doUpload()">上传入库</button>
      </div>
      <p class="msg" id="up-msg"></p>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>ID</th><th>文件名</th><th>上传者</th><th>状态</th><th>切片</th><th>时间</th><th>操作</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty" id="empty" hidden>还没有文档，先上传一个</p>
    </div>

    <div class="card">
      <h3 style="margin-bottom:10px;font-size:15px">🔥 互动看板（别人提问会实时反映到这里，自动刷新）</h3>
      <table>
        <thead><tr><th>文档</th><th>上传者</th><th>被问次数</th><th>最近一次问题</th></tr></thead>
        <tbody id="stat-rows"></tbody>
      </table>
    </div>

    <div class="card">
      <h3 style="margin-bottom:10px;font-size:15px">📡 实时动态（别人的上传/提问 3 秒内出现在这里并弹窗提醒）</h3>
      <div id="act-rows"><p class="empty">加载中...</p></div>
    </div>
  </div>

<script>
const me = localStorage.getItem("kb_user");
if (!localStorage.getItem("kb_token")) location.href = "index.html";  // 没登录踢回登录页
document.getElementById("who").textContent = "当前用户：" + me;
if (localStorage.getItem("kb_admin") === "1") {
  document.getElementById("admin-link").hidden = false;  // 管理员才显示管理端入口
}

function headers() { return { "X-Token": localStorage.getItem("kb_token") }; }

// 统一拦截 401：token 失效（如后端重启）时自动跳回登录页
function chk(r) {
  if (r.status === 401) {
    localStorage.removeItem("kb_token");
    localStorage.removeItem("kb_user");
    location.href = "index.html";
  }
  return r;
}

// HTML 转义：文件名/用户名/问题都来自用户输入，直接拼 innerHTML 会被注入脚本（XSS）
const esc = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

let currentEditingId = null;  // 当前正在重命名的文档 ID，防止多行同时编辑

async function load() {
  const r = chk(await fetch("/kb/docs", { headers: headers() }));
  const data = await r.json();
  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";
  const docs = data.documents || [];
  document.getElementById("empty").hidden = docs.length > 0;
  for (const d of docs) {
    const tr = document.createElement("tr");
    // 上传者本人或管理员都可以操作（后端会再独立校验一次权限）
    const canManage = d.uploader === me || localStorage.getItem("kb_admin") === "1";
    let actions = "";
    if (canManage) {
      if (currentEditingId === d.id) {
        // 正在编辑：显示输入框 + 确认/取消按钮
        actions = `<span class="row-edit"><input id="rename-input-${d.id}" value="${esc(d.filename)}"></span>
          <button class="small" style="background:#2eaa5e" onclick="confirmRename(${d.id})">确认</button>
          <button class="small" style="background:#888" onclick="cancelRename()">取消</button>`;
      } else {
        actions = `<button class="rename" onclick="startRename(${d.id})">重命名</button>
          <button class="del" onclick="doDelete(${d.id})">删除</button>`;
      }
    }
    // 审核流状态徽章：pending→approved/rejected 三态一目了然
    const stMap = {
      pending:  ["⏳ 待审核", "#b45309", "#fef3c7"],
      approved: ["✅ 已入库", "#2eaa5e", "#e6f7ec"],
      rejected: ["❌ 已驳回", "#d93025", "#fde8e6"],
    };
    const st = stMap[d.status] || stMap.approved;
    tr.innerHTML = `<td>${d.id}</td><td>${esc(d.filename)}</td><td>${esc(d.uploader)}</td>
                    <td><span style="font-size:12px;padding:2px 8px;border-radius:10px;color:${st[1]};background:${st[2]}">${st[0]}</span></td>
                    <td>${d.chunks}</td><td>${d.created_at.slice(0, 19).replace("T", " ")}</td>
                    <td>${actions}</td>`;
    tbody.appendChild(tr);
  }
}

function startRename(id) {
  currentEditingId = id;
  load();
}

function cancelRename() {
  currentEditingId = null;
  load();
}

async function confirmRename(id) {
  const input = document.getElementById(`rename-input-${id}`);
  const newName = input.value.trim();
  if (!newName) { alert("文件名不能为空"); return; }
  const r = chk(await fetch(`/kb/docs/${id}`, {
    method: "PUT",
    headers: { ...headers(), "Content-Type": "application/json" },
    body: JSON.stringify({ filename: newName })
  }));
  const data = await r.json();
  if (r.status !== 200) { alert(data.detail || "修改失败"); return; }
  currentEditingId = null;
  load();
  showMsg("up-msg", `已重命名：《${data.old_name}》→ 《${data.new_name}》`, true);
}

async function doUpload() {
  const f = document.getElementById("file").files[0];
  if (!f) { showMsg("up-msg", "请先选择文件", false); return; }
  const fd = new FormData();
  fd.append("file", f);
  const r = chk(await fetch("/kb/upload", { method: "POST", headers: headers(), body: fd }));
  const data = await r.json();
  if (r.status === 200) {
    showMsg("up-msg", `《${data.filename}》已提交，等待管理员审核通过后入库`, true);
    load();
    loadStats();
  } else {
    showMsg("up-msg", data.detail || "上传失败", false);
  }
}

async function doDelete(id) {
  if (!confirm(`确定删除文档 ${id} 吗？`)) return;
  const r = chk(await fetch(`/kb/docs/${id}`, { method: "DELETE", headers: headers() }));
  const data = await r.json();
  if (r.status !== 200) { alert(data.detail || "删除失败"); return; }
  load();
  loadStats();
}

function showMsg(id, text, ok) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "err");
}

// 互动看板：读 /kb/stats，展示每个文档被问次数和最近问题
async function loadStats() {
  const r = chk(await fetch("/kb/stats", { headers: headers() }));
  const data = await r.json();
  const tbody = document.getElementById("stat-rows");
  tbody.innerHTML = "";
  const stats = data.stats || [];
  if (!stats.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">还没有数据，去聊天页提问试试</td></tr>';
    return;
  }
  for (const s of stats) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${esc(s.filename)}</td><td>${esc(s.uploader)}</td><td>${s.asks}</td>
                    <td>${esc(s.last_question || "—")}</td>`;
    tbody.appendChild(tr);
  }
}

function logout() {
  localStorage.removeItem("kb_token");
  location.href = "index.html";
}

// ============ 多端互动核心：实时活动流 + 弹窗通知 ============
// 验收标准要求"多端系统的互动"（如买家下单→卖家收到消息）。
// 实现：每 3 秒轮询 /kb/activity，发现比上次新的活动就：
//   1) 更新页面底部"实时动态"列表
//   2) 右上角弹窗通知（别人做的事，我这边立刻感知到）
let lastActTime = null;   // 上次看到的最新活动时间，用于判断"新事件"

function toast(html) {
  const box = document.getElementById("toast-box");
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = html;   // 内容已在本函数内做 esc() 转义，安全
  box.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}

async function pollActivity() {
  const r = chk(await fetch("/kb/activity", { headers: headers() }));
  const data = await r.json();
  const acts = data.activities || [];
  const box = document.getElementById("act-rows");
  box.innerHTML = "";
  if (!acts.length) {
    box.innerHTML = '<p class="empty">还没有动态</p>';
    return;
  }
  for (const a of acts) {
    const div = document.createElement("div");
    div.className = "act-item";
    const icon = a.type === "upload" ? "📤" : "❓";
    const verb = a.type === "upload" ? "提交了文档（待审核）" : "提问";
    div.innerHTML = `<span class="act-icon">${icon}</span>
      <span><b>${esc(a.actor)}</b> ${verb}《${esc(a.detail)}》</span>
      <span class="act-time">${esc(a.time.slice(11, 19))}</span>`;
    box.appendChild(div);
  }
  // 弹窗：只给"别人的新事件"弹（首次加载不弹，自己操作不弹）
  if (lastActTime !== null && acts.length) {
    for (const a of acts) {
      if (a.time > lastActTime && a.actor !== me) {
        const verb = a.type === "upload" ? "提交了文档待审核" : "刚问了问题";
        toast(`📡 <b>${esc(a.actor)}</b> ${verb}<br>${esc(a.detail)}`);
      }
    }
  }
  if (acts.length) lastActTime = acts[0].time;
}

load();
loadStats();
pollActivity();
setInterval(() => { if (currentEditingId === null) load(); }, 5000);   // 文档列表 5 秒刷新
setInterval(loadStats, 10000);                                         // 看板 10 秒刷新
setInterval(pollActivity, 3000);                                       // 活动流 3 秒刷新（互动感知）
</script>
</body>
</html>
